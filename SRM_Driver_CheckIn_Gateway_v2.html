<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SRM Logistics Driver Check-In</title>

<style>

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#1f2937;
  display:flex;
  min-height:100vh;
  align-items:center;

}

.card{
  width:min(760px,100%);

  overflow:hidden;
  background:#fff;
}

.header{
  padding:24px 28px;
  border-bottom:4px solid #0b2d5c;
}

.brand{
  font-size:34px;
  font-weight:800;
  letter-spacing:.5px;
  color:#0b2d5c;
  margin:0;
}

.sub{
  margin:6px 0 0;
  font-size:16px;
  font-weight:700;
  color:#4b5563;
}

.content{
  padding:30px;
}

.alert{
  border:3px solid #b83224;
  background:#fff7f5;
  border-radius:14px;
  padding:24px;
  text-align:center;
}

.alert h1{
  margin:0 0 14px;
  color:#b83224;
  font-size:30px;
}

.alert p{
  margin:10px 0;
  font-size:22px;
  font-weight:700;
  line-height:1.35;
}

.holiday{
  border:3px solid #0b2d5c;
  background:#f4f8ff;
  border-radius:14px;
  padding:24px;
  text-align:center;
}

.holiday h1{
  margin:0 0 14px;
  color:#0b2d5c;
  font-size:30px;
}

.holiday h2{
  margin:12px 0;
  color:#b83224;
  font-size:27px;
}

.holiday p{
  margin:10px 0;
  font-size:21px;
  font-weight:700;
  line-height:1.35;
}

.address{
  color:#0b2d5c;
  font-size:21px!important;
}

.help{
  margin-top:18px!important;
  color:#b83224;
}

.open{
  text-align:center;
  padding:10px 0 0;
}

.open h1{
  color:#14823b;
  font-size:28px;
  margin:0 0 12px;
}

.open p{
  font-size:18px;
  margin:6px 0;
}

.btn{
  display:inline-block;
  margin:12px 8px 0;
  padding:14px 22px;
  border-radius:10px;
  background:#0b2d5c;
  color:#fff;
  text-decoration:none;
  font-weight:700;
  font-size:18px;
  border:0;
  cursor:pointer;
  min-width:250px;
}

.small{
  margin-top:20px;
  color:#6b7280;
  font-size:13px;
  text-align:center;
}

</style>
</head>


<body>

<main class="card">

<div class="header">

  <div class="brand">
    SRM
  </div>

  <div class="sub">
    Specialty Rolled Metals — Logistics Driver Check-In
  </div>

</div>

<div class="content" id="content"></div>

</main>


<script>

/* =====================================================
   EXISTING MICROSOFT FORM
   DO NOT CHANGE
   ===================================================== */

const FORM_URL =
"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=3cVIiWDZM0arWL-bU52JehAYwZgLLgZPmEQS1ku1pXBUOVRBWUJZNTM4WUhSVVQxVVFORUZYQktPNi4u";

const TZ = "America/Chicago";


/* =====================================================
   GET CURRENT CENTRAL TIME / DATE
   ===================================================== */

function centralTime(){

  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone:TZ,
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    weekday:"short",
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  }).formatToParts(new Date());

  return {

    year:
      Number(parts.find(p=>p.type==="year").value),

    month:
      Number(parts.find(p=>p.type==="month").value),

    date:
      Number(parts.find(p=>p.type==="day").value),

    day:
      parts.find(p=>p.type==="weekday").value,

    hour:
      Number(parts.find(p=>p.type==="hour").value),

    minute:
      Number(parts.find(p=>p.type==="minute").value)

  };
}


/* =====================================================
   TIME HELPERS
   ===================================================== */

function minutesNow(){

  const {hour,minute}=centralTime();

  return (hour*60)+minute;
}


function between(startHour,startMinute,endHour,endMinute){

  const now=minutesNow();

  const start=(startHour*60)+startMinute;
  const end=(endHour*60)+endMinute;

  return now>=start && now<end;
}


/* =====================================================
   HOLIDAY CALENDAR HELPERS
   ===================================================== */

/*
  weekday:
  0 = Sunday
  1 = Monday
  2 = Tuesday
  3 = Wednesday
  4 = Thursday
  5 = Friday
  6 = Saturday
*/

function nthWeekdayOfMonth(year,month,weekday,nth){

  const firstDay =
    new Date(Date.UTC(year,month-1,1)).getUTCDay();

  const offset =
    (weekday-firstDay+7)%7;

  return 1+offset+((nth-1)*7);
}


function lastWeekdayOfMonth(year,month,weekday){

  const lastDate =
    new Date(Date.UTC(year,month,0));

  const lastDay =
    lastDate.getUTCDay();

  return lastDate.getUTCDate()
    - ((lastDay-weekday+7)%7);
}


/* =====================================================
   SRM HOLIDAY SCHEDULE

   Based on SRM posted holiday schedule:

   Memorial Day
   Independence Day
   Labor Day
   Thanksgiving Day
   Christmas Eve
   Christmas Day
   New Year's Day
   ===================================================== */

function getSRMHoliday(){

  const {year,month,date}=centralTime();


  /* NEW YEAR'S DAY */
  if(month===1 && date===1){

    return "New Year's Day";

  }


  /* MEMORIAL DAY
     LAST MONDAY OF MAY
  */

  const memorialDay =
    lastWeekdayOfMonth(year,5,1);

  if(month===5 && date===memorialDay){

    return "Memorial Day";

  }


  /* INDEPENDENCE DAY */
  if(month===7 && date===4){

    return "Independence Day";

  }


  /* LABOR DAY
     FIRST MONDAY OF SEPTEMBER
  */

  const laborDay =
    nthWeekdayOfMonth(year,9,1,1);

  if(month===9 && date===laborDay){

    return "Labor Day";

  }


  /* THANKSGIVING
     FOURTH THURSDAY OF NOVEMBER
  */

  const thanksgiving =
    nthWeekdayOfMonth(year,11,4,4);

  if(month===11 && date===thanksgiving){

    return "Thanksgiving Day";

  }


  /* CHRISTMAS EVE */
  if(month===12 && date===24){

    return "Christmas Eve";

  }


  /* CHRISTMAS DAY */
  if(month===12 && date===25){

    return "Christmas Day";

  }


  return null;
}


/* =====================================================
   PICKUP / LOADING HOURS

   MONDAY–FRIDAY
   6:00 AM – 4:00 PM
   6:00 PM – 10:00 PM

   SATURDAY
   6:00 AM – 12:00 PM
   4:00 PM – 9:00 PM

   SUNDAY
   CLOSED
   ===================================================== */

function pickupIsOpen(){

  /* HOLIDAY OVERRIDE */

  if(getSRMHoliday()){

    return false;

  }


  const {day}=centralTime();


  if(
    day==="Mon" ||
    day==="Tue" ||
    day==="Wed" ||
    day==="Thu" ||
    day==="Fri"
  ){

    return (

      between(6,0,16,0) ||

      between(18,0,22,0)

    );

  }


  if(day==="Sat"){

    return (

      between(6,0,12,0) ||

      between(16,0,21,0)

    );

  }


  return false;
}


/* =====================================================
   DELIVERY HOURS
   BY APPOINTMENT ONLY

   MONDAY–FRIDAY
   6:00 AM – 5:00 PM

   SATURDAY / SUNDAY
   CLOSED
   ===================================================== */

function deliveryIsOpen(){

  /* HOLIDAY OVERRIDE */

  if(getSRMHoliday()){

    return false;

  }


  const {day}=centralTime();


  if(
    day==="Mon" ||
    day==="Tue" ||
    day==="Wed" ||
    day==="Thu" ||
    day==="Fri"
  ){

    return between(6,0,17,0);

  }


  return false;
}


const content =
document.getElementById("content");


/* =====================================================
   SRM HOLIDAY CLOSED SCREEN
   ===================================================== */

function showHoliday(holidayName){

  content.innerHTML=`

  <section class="holiday">

    <h1>
      🇺🇸 SRM HOLIDAY
    </h1>

    <h2>
      FACILITY CLOSED
    </h2>

    <p>
      Specialty Rolled Metals is closed today
      in observance of
      <strong>${holidayName}</strong>.
    </p>

    <p>
      Driver Pickup & Delivery Check-In
      is unavailable today.
    </p>

    <p>
      Please return during the next
      scheduled business hours.
    </p>

    <p>
      FOR HELP CALL
    </p>

    <p class="help">
      📞 630-871-5765
    </p>

  </section>

  <div class="small">
    SRM Logistics Driver Check-In
  </div>

  `;

}


/* =====================================================
   CLOSED / AFTER-HOURS SCREEN
   ===================================================== */

function showAfterHours(type){

  content.innerHTML=`

  <section class="alert">

    <h1>
      🌙 AFTER-HOURS CHECK-IN
    </h1>

    <p>
      ${type} check-in is currently unavailable.
    </p>

    <p>
      Please check in at the Shipping Desk
      through Door W2.
    </p>

    <p class="address">
      457 St. Paul Blvd.,
      Carol Stream, IL 60188
    </p>

    <p>
      <strong>
        DURING BUSINESS HOURS FOR HELP CALL
      </strong>
    </p>

    <p class="help">
      📞 630-871-5765
    </p>

  </section>

  <div class="small">
    Driver form submission is unavailable
    for this check-in type at this time.
  </div>

  `;

}


/* =====================================================
   PICKUP BUTTON
   ===================================================== */

function selectPickup(){

  const holiday =
    getSRMHoliday();


  if(holiday){

    showHoliday(holiday);

    return;

  }


  if(pickupIsOpen()){

    location.replace(FORM_URL);

  }
  else{

    showAfterHours("Pickup");

  }

}


/* =====================================================
   DELIVERY BUTTON
   ===================================================== */

function selectDelivery(){

  const holiday =
    getSRMHoliday();


  if(holiday){

    showHoliday(holiday);

    return;

  }


  if(deliveryIsOpen()){

    location.replace(FORM_URL);

  }
  else{

    showAfterHours("Delivery");

  }

}


/* =====================================================
   FIRST CHECK:
   IS TODAY AN SRM HOLIDAY?
   ===================================================== */

const holidayToday =
getSRMHoliday();


if(holidayToday){

  /*
    IMPORTANT:
    ON A HOLIDAY THE DRIVER DOES NOT EVEN
    SEE PICKUP / DELIVERY BUTTONS.

    THEY IMMEDIATELY SEE FACILITY CLOSED.
  */

  showHoliday(holidayToday);

}

else{

  /* ===================================================
     NORMAL CHECK-IN SCREEN
     =================================================== */

  content.innerHTML=`

  <section class="open">

    <h1>
      DRIVER CHECK-IN
    </h1>

    <p>
      Please select your check-in type.
    </p>

    <button
      class="btn"
      onclick="selectPickup()">

      🚛 PICKUP

    </button>

    <br>

    <button
      class="btn"
      onclick="selectDelivery()">

      🚚 DELIVERY

    </button>

    <div class="small">
      Check-in availability is automatically
      controlled using Central Time.
    </div>

  </section>

  `;

}

</script>

</body>
</html>
