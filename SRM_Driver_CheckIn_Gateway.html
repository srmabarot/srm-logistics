<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRM Logistics Driver Check-In</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#1f2937;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.card{width:min(760px,100%);border:1px solid #d7dee8;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden;background:#fff}
.header{padding:24px 28px;border-bottom:4px solid #0b2d5c}
.brand{font-size:34px;font-weight:800;letter-spacing:.5px;color:#0b2d5c;margin:0}
.sub{margin:6px 0 0;font-size:16px;font-weight:700;color:#4b5563}
.content{padding:30px}
.alert{border:3px solid #b83224;background:#fff7f5;border-radius:14px;padding:24px;text-align:center}
.alert h1{margin:0 0 14px;color:#b83224;font-size:30px}
.alert p{margin:10px 0;font-size:22px;font-weight:700;line-height:1.35}
.address{color:#0b2d5c;font-size:21px!important}
.help{margin-top:18px!important;color:#b83224}
.open{text-align:center;padding:10px 0 0}
.open h1{color:#14823b;font-size:28px;margin:0 0 12px}
.open p{font-size:18px;margin:6px 0}
.btn{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:10px;background:#0b2d5c;color:#fff;text-decoration:none;font-weight:700;font-size:18px}
.small{margin-top:20px;color:#6b7280;font-size:13px;text-align:center}
</style>
</head>
<body>
<main class="card">
<div class="header">
<div class="brand">SRM</div>
<div class="sub">Specialty Rolled Metals — Logistics Driver Check-In</div>
</div>
<div class="content" id="content"></div>
</main>
<script>
const FORM_URL = "https://forms.cloud.microsoft/r/hoKHmGTKXz";
const TZ = "America/Chicago";
function centralHourMinute(){
  const parts = new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const hour = Number(parts.find(p=>p.type==="hour").value);
  const minute = Number(parts.find(p=>p.type==="minute").value);
  return {hour,minute};
}
function isAfterHours(){
  const {hour} = centralHourMinute();
  return hour >= 17 || hour < 6;
}
const content=document.getElementById("content");
if(isAfterHours()){
  content.innerHTML=`<section class="alert">
  <h1>🌙 AFTER-HOURS CHECK-IN</h1>
  <p>After 5 PM, please check in at the Shipping Desk through Door W2.</p>
  <p class="address">457 St. Paul Blvd., Carol Stream, IL 60188</p>
  <p class="help">📞 For Help Call 630-871-5765</p>
  </section>
  <div class="small">Driver form submission is unavailable during after-hours check-in.</div>`;
}else{
  content.innerHTML=`<section class="open">
  <h1>Driver Check-In</h1>
  <p>Check-in is available.</p>
  <p>You will be redirected to the SRM Logistics Pickup & Delivery form.</p>
  <a class="btn" href="${FORM_URL}">Continue to Check-In</a>
  </section>`;
  setTimeout(()=>location.replace(FORM_URL),1800);
}
</script>
</body>
</html>
